<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <title>px-manager</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(100% - 32px, 360px); }
    form { display: grid; gap: 14px; }
    h1 { margin: 0 0 20px; font-size: 28px; font-weight: 650; }
    label { display: grid; gap: 6px; font-size: 14px; }
    input { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid color-mix(in srgb, CanvasText 25%, Canvas); border-radius: 6px; font: inherit; background: Canvas; color: CanvasText; }
    button { padding: 10px 14px; border: 0; border-radius: 6px; font: inherit; font-weight: 650; color: white; background: #1769aa; cursor: pointer; }
    .button { display: inline-block; padding: 10px 14px; border-radius: 6px; font: inherit; font-weight: 650; color: white; background: #1769aa; text-decoration: none; }
    .error { margin: 0 0 14px; padding: 10px 12px; border-radius: 6px; color: #8a1f11; background: #fde8e4; }
    .session { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .session a { color: #1769aa; }
    .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    {% if current_user %}
      <h1>px-manager</h1>
      <div class="session">
        <span>Signed in as <strong>{{ escape(current_user) }}</strong></span>
        <a href="/logout">Logout</a>
      </div>
      <div class="actions">
        <a class="button" href="/api/generate/proxy-list" download="proxy-list.txt">Download proxy list</a>
      </div>
    {% else %}
      <h1>px-manager</h1>
      {% if error %}<p class="error">{{ escape(error) }}</p>{% end %}
      <form method="post" action="/">
        <label>
          Login
          <input name="username" autocomplete="username" autofocus required>
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Login</button>
      </form>
    {% end %}
  </main>
</body>
</html>
