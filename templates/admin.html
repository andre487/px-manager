<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <title>Admin - px-manager</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(100% - 32px, 620px); }
    h1 { margin: 0 0 20px; font-size: 28px; font-weight: 650; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-size: 14px; }
    textarea { box-sizing: border-box; width: 100%; min-height: 180px; resize: vertical; padding: 10px 12px; border: 1px solid color-mix(in srgb, CanvasText 25%, Canvas); border-radius: 6px; font: inherit; background: Canvas; color: CanvasText; }
    button { width: fit-content; padding: 10px 14px; border: 0; border-radius: 6px; font: inherit; font-weight: 650; color: white; background: #1769aa; cursor: pointer; }
    .hint { margin: 0; color: color-mix(in srgb, CanvasText 65%, Canvas); font-size: 13px; }
    .saved { margin: 0 0 14px; padding: 10px 12px; border-radius: 6px; color: #14532d; background: #dcfce7; }
    .nav { margin-top: 18px; }
    .nav a { color: #1769aa; }
  </style>
</head>
<body>
  <main>
    <h1>Admin</h1>
    {% if saved %}<p class="saved">Message saved.</p>{% end %}
    <form method="post" action="/admin">
      <label>
        Homepage message
        <textarea name="message" autofocus>{{ message }}</textarea>
      </label>
      <p class="hint">Markdown: **bold**, *italic*, [link](https://example.com).</p>
      <button type="submit">Save message</button>
    </form>
    <div class="nav">
      <a href="/">Back to home</a>
    </div>
  </main>
</body>
</html>
