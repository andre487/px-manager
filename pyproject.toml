[project]
name = "px-manager"
version = "0.1.1"
description = "Proxy info manager"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "click>=8.5.0",
    "dnspython>=2.8.0",
    "icmplib>=3.0.4",
    "telethon>=1.45.0",
    "tornado>=6.5.10",
    "user-agents>=2.2.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyinstaller>=6.22.3",
]
